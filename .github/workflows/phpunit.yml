name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        laravel: [12, 13]
        dependency-flags: ['--prefer-lowest --prefer-stable', '--prefer-stable']
        include:
          - laravel: 12
            laravel_constraint: ^12.69.2
            testbench_constraint: ^10.12
          - laravel: 13
            laravel_constraint: ^13.32
            testbench_constraint: ^11.3

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-flags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Configure Laravel dependencies
        run: composer require --dev "laravel/framework:${{ matrix.laravel_constraint }}" "orchestra/testbench:${{ matrix.testbench_constraint }}" --no-update

      - name: Install dependencies
        run: composer update ${{ matrix.dependency-flags }} --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Execute tests
        run: composer test -- --order-by random

      - name: Analyse code
        run: composer analyse -- --no-progress
