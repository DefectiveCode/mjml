name: Code Styling

on: [push, pull_request]

jobs:
    code-styling:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - run: bun install

            - name: Bun Tests
              run: bun test build/mjml.test.mjs

            - name: Prettier
              run: bunx prettier --check "{!(vendor|node_modules)/**/*,*}.{js,ts,jsx,tsx,vue,xml,json,blade.php,css,md,yml,html}"

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  extensions: mbstring
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction

            - name: Pint
              run: vendor/bin/pint --test
